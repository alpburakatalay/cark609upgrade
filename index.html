<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Yasemin Kalender’in Harika Sınıfı</title>
<style>
:root{--a:#ffd166;--f:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--f);background:#0a0d24}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;z-index:1}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;pointer-events:none;z-index:2}
h1{margin:0;font-size:clamp(20px,3.6vw,38px);letter-spacing:.04em;opacity:0;animation:in 1.6s 1.8s forwards}
#hint{opacity:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--a);animation:in 1.2s 2.8s forwards;margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(-14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#panel{position:fixed;right:14px;top:84px;bottom:90px;width:250px;overflow:auto;padding:14px;border-radius:18px;background:rgba(128,128,128,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);z-index:3;opacity:0;transform:translateX(40px);transition:.9s 3s}
body.ready #panel{opacity:1;transform:none}
#panel h3{margin:12px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--a)}
button,select{font:inherit;color:inherit;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:7px 10px;cursor:pointer;margin:2px 0}
select option{color:#111}
input[type=number]{width:60px;font:inherit;color:inherit;border-radius:10px;padding:7px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14)}
button:hover{background:var(--a);color:#111}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#time{font-size:32px;font-variant-numeric:tabular-nums;font-weight:700}
#sel{margin:0;padding-left:20px;font-size:14px}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:0;right:0;text-align:center;z-index:3;opacity:0;transition:1s 3.2s}
body.ready #bar{opacity:1}
#go{font-size:18px;font-weight:700;padding:14px 34px;border-radius:40px;background:var(--a);color:#111;border:0;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#go:disabled{opacity:.5}
#res{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);z-index:5;padding:22px 44px;border-radius:22px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);text-align:center;font-size:clamp(26px,6vw,56px);font-weight:800;color:#fff;border:2px solid var(--a);transition:transform .6s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
#res.show{transform:translate(-50%,-50%) scale(1)}
#res small{display:block;font-size:14px;color:var(--a);letter-spacing:.2em}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#modal.on{display:flex}
#mb{background:#1b1d2e;color:#fff;border-radius:18px;padding:20px;width:min(760px,94vw);max-height:80vh;overflow:auto}
#mb textarea{width:100%;height:240px;box-sizing:border-box;border-radius:10px;padding:10px;font:inherit}
#pt{display:none;position:fixed;right:14px;top:70px;z-index:4}
@media(max-width:900px){#panel{top:auto;bottom:80px;left:10px;right:10px;width:auto;max-height:42vh;display:none}body.pan #panel{display:block}#pt{display:block}}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0}
.sc{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 10px;text-align:center}
.sc b{display:block;margin:2px 0;font-size:14px}.sc small{display:block;opacity:.8}
.sc input{width:100%;box-sizing:border-box;border-radius:8px;padding:5px;margin-top:6px;font:inherit;font-size:13px}
details{margin-top:10px}summary{cursor:pointer}
</style></head><body>
<canvas id="cv"></canvas>
<div id="top"><h1>Yasemin Kalender’in Harika Sınıfı</h1><div id="hint">Döndürmek için tıkla</div></div>
<button id="pt">☰ Panel</button>
<div id="panel">
<select id="theme"></select>
<div class="row"><button id="bS">Öğrenciler</button><button id="bG">Gruplar</button></div>
<label style="font-size:13px;display:block;margin-top:6px"><input type="checkbox" id="rm" checked> Seçilen çıkarılsın</label>
<h3>⏱ Süre</h3><div id="time">05:00</div>
<div class="row"><input id="mi" type="number" min="0" max="60" value="5" placeholder="dk"><input id="se" type="number" min="0" max="59" value="0" placeholder="sn"></div>
<div class="row"><button id="t1">Başlat</button><button id="t2">Duraklat</button><button id="t3">Sıfırla</button></div>
<h3>Grup</h3>
<div class="row"><select id="gs"></select><button id="gb">Grupla</button></div>
<h3>Seçilenler</h3><ol id="sel"></ol>
<div style="margin-top:12px"><button id="rs">Verileri Sıfırla</button></div>
</div>
<div id="bar"><button id="go">Çarkı Döndür</button></div>
<div id="res"></div>
<div id="modal"><div id="mb"></div></div>

/* yardımcılar: Fisher-Yates, not, konfeti */
function fisherYatesShuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
const noteOf=s=>{const m=M[s];return m&&typeof m.note==='string'?m.note:(DESC[s]||'')};
function triggerConfetti(){if(!window.confetti)return;const end=Date.now()+2000,d={startVelocity:30,spread:360,ticks:60,zIndex:20},rn=(a,b)=>Math.random()*(b-a)+a;
 const t=setInterval(()=>{const tl=end-Date.now();if(tl<=0)return clearInterval(t);confetti(Object.assign({},d,{particleCount:50*(tl/2000),origin:{x:rn(.1,.9),y:Math.random()-.2}}))},250)}

function pts(n,size){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(n*3),3));return new THREE.Points(g,new THREE.PointsMaterial({size,vertexColors:true,transparent:true,depthWrite:false}))}
const dust=pts(140,.035),conf=pts(220,.07);sc.add(dust,conf);conf.visible=false;
const dp=dust.geometry.attributes.position;for(let i=0;i<140;i++)dp.setXYZ(i,(Math.random()-.5)*14,-2.4+Math.random()*6,-2.5-Math.random()*5);
let cvel=[],ct=0;

function applyTheme(){
 const t=TH[tn];document.documentElement.style.setProperty('--a',t[2]);document.documentElement.style.setProperty('--f',t[5]);
 document.body.style.background=`radial-gradient(circle at 40% 40%,${t[0]},${t[1]})`;
 metal.color.set(t[4]);polish.color.set(t[4]);hm.color.set(t[2]);drawRehaut();drawBg();
 const c=new THREE.Color(t[2]),a=dust.geometry.attributes.color;for(let i=0;i<140;i++)a.setXYZ(i,c.r,c.g,c.b);a.needsUpdate=true;
 document.body.style.fontFamily=tn=='Terminal'?'ui-monospace,Consolas,monospace':'';sv('t',tn);drawDial()}
let CD=6;
function size(){const w=innerWidth,h=innerHeight,a=w/h;r.setSize(w,h,false);cam.aspect=a;CD=Math.max(6.2,6.4/a);cam.updateProjectionMatrix()}
addEventListener('resize',size);size();

/* audio */
let ac;const au=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac};
function beep(f,d,ty,v,dl){const c=au();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(dl||0);o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}
const tick=()=>beep(1900,.03,'square',.05);
const chime=()=>[660,880,1320].forEach((f,i)=>beep(f,.6,'sine',.12,i*.14));
const bell=()=>[0,1,2].forEach(i=>beep(1046,.6,'sine',.18,i*.4));
const A1=$('#a1'),A2=$('#a2');
function stopBell(){try{A2.pause();A2.currentTime=0}catch(e){}}
function playBell(){try{A2.loop=true;A2.currentTime=0;const p=A2.play();if(p&&p.catch)p.catch(()=>bell())}catch(e){bell()}}

/* state */
let th=0,spin=null,spun=false,lastIdx=-1,mx=0,my=0,t0=performance.now(),ready=false;
const ease=t=>1-Math.pow(1-t,3);
function go(){
 if(spin)return;drawDial();const p=pool();
 if(!p.length){flash('Herkes seçildi 🎉');return}
 au();stopBell();$('#res').classList.remove('show');
 /* Fisher-Yates ile karıştır, ilk çıkan kazanır; çark o dilimde durur */
 const w=fisherYatesShuffle(p)[0],i=p.indexOf(w),st=TAU/p.length,tgt=(i+.12+Math.random()*.76)*st,dd=(((tgt-th)%TAU)+TAU)%TAU;
 spun=true;spin={a:th,D:TAU*(5+Math.floor(Math.random()*3))+dd,t0:performance.now(),d:SES_SURESI,p:p.slice(),w};lastIdx=-1;$('#go').disabled=true;
 try{A1.currentTime=0;const pr=A1.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}}
function finish(){
 const w=spin.w;spin=null;$('#go').disabled=false;
 if($('#rm').checked&&!picked.includes(w)){picked.push(w);sv('p',picked)}
 const m=M[w]||(M[w]={c:0});m.c=(m.c||0)+1;sv('m',M);const nt=noteOf(w);
 $('#res').innerHTML='<small>SEÇİLEN</small>'+av(w,120)+esc(w)+(nt?'<small style="text-transform:none;letter-spacing:0;font-weight:400;font-size:16px;color:#fff">📝 '+esc(nt)+'</small>':'')+'<small>'+m.c+'. kez seçildi</small>';
 $('#res').classList.add('show');chime();boom();list();triggerConfetti();
 setTimeout(drawDial,2200)}
function boom(){
 const pal=TH[tn][3].concat([TH[tn][2]]),a=conf.geometry.attributes.position,c=conf.geometry.attributes.color;cvel=[];
 for(let i=0;i<220;i++){a.setXYZ(i,0,0,.5);const k=new THREE.Color(pal[i%pal.length]);c.setXYZ(i,k.r,k.g,k.b);
  const ang=Math.random()*TAU,sp=1+Math.random()*3;cvel.push([Math.cos(ang)*sp,Math.sin(ang)*sp+1.5,(Math.random()-.2)*2])}
 a.needsUpdate=c.needsUpdate=true;conf.visible=true;conf.material.opacity=1;ct=performance.now()}
function list(){$('#sel').innerHTML=picked.map(s=>'<li>'+s.replace(/</g,'&lt;')+'</li>').join('')}

function loop(now){
 requestAnimationFrame(loop);
 const p=Math.min(1,(now-t0)/3400),e=ease(p),idle=Math.floor(Date.now()/1000),fr=(Date.now()%1000)/1000,
  idleTh=((idle-1)+ease(Math.min(1,fr*8)))*TAU/60;
 if(!spun&&!spin)th=idleTh-(1-e)*TAU*3;
 if(spin){const t=Math.min(1,(now-spin.t0)/spin.d),k=1-Math.pow(1-t,4);th=spin.a+spin.D*k;
  const i=Math.floor((((th%TAU)+TAU)%TAU)/(TAU/spin.p.length));if(i!==lastIdx){if(lastIdx>=0&&A1.paused)tick();lastIdx=i}
  if(t>=1)finish()}
 hand.rotation.z=-th;
 if(p>=1&&!ready){ready=true;document.body.classList.add('ready')}
 /* kamera: girişte uzaktan yaklaşır, fareyle hafifçe yörüngede döner (saat standda sabit) */
 const bx=innerWidth>900?.6:0;
 mx+=(tx-mx)*.05;my+=(ty-my)*.05;
 const az=mx*.3+(1-e)*.9+Math.sin(now/7000)*.04,el=.13-my*.09+(1-e)*.3,D=CD*(1+(1-e)*1.2);
 cam.position.set(bx+Math.sin(az)*Math.cos(el)*D,-.3+Math.sin(el)*D,Math.cos(az)*Math.cos(el)*D);cam.lookAt(bx,-.3,0);
 pl.position.set(Math.sin(now/1500)*3,Math.cos(now/1900)*2.5,3);
 if(conf.visible){const dt=(now-ct)/1000,a=conf.geometry.attributes.position;
  for(let i=0;i<220;i++)a.setXYZ(i,cvel[i][0]*dt,cvel[i][1]*dt-2.2*dt*dt,.5+cvel[i][2]*dt);
  a.needsUpdate=true;conf.material.opacity=Math.max(0,1-dt/3);if(dt>3)conf.visible=false}
 dust.rotation.z=now/60000;
 r.render(sc,cam)}
let tx=0,ty=0;
addEventListener('pointermove',ev=>{tx=ev.clientX/innerWidth*2-1;ty=ev.clientY/innerHeight*2-1});
cv.addEventListener('click',go);$('#go').onclick=go;

/* UI */
Object.keys(TH).forEach(k=>$('#theme').add(new Option(k,k)));$('#theme').value=tn;
$('#theme').onchange=e=>{tn=e.target.value;applyTheme()};
for(let i=2;i<=8;i++)$('#gs').add(new Option(i+' Kişi',i));
$('#rm').onchange=drawDial;
$('#pt').onclick=()=>document.body.classList.toggle('pan');
const modal=h=>{$('#mb').innerHTML=h+'<p><button id="mx">Kapat</button></p>';$('#mx').onclick=()=>$('#modal').classList.remove('on');$('#modal').classList.add('on')};
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};

/* öğrenciler: avatar, seçilme sayısı, not */
$('#bS').onclick=()=>{
 modal('<h2>Öğrenciler</h2><div class="sg">'+S.map((s,i)=>'<div class="sc">'+av(s,64)+'<b>'+esc(s)+'</b><small>📊 Seçilme: <strong>'+((M[s]||{}).c||0)+'</strong></small><input class="nt" data-i="'+i+'" placeholder="Not" value="'+esc(noteOf(s))+'"></div>').join('')+'</div><details><summary>Öğrenci listesini düzenle</summary><p style="font-size:13px">Her satıra bir isim yazın.</p><textarea id="ta">'+esc(S.join('\n'))+'</textarea></details><p><button id="sv">Kaydet</button></p>');
 $('#sv').onclick=()=>{const old=S.slice();
  document.querySelectorAll('.nt').forEach(el=>{const s=old[+el.dataset.i];(M[s]=M[s]||{c:0}).note=el.value});
  S=[...new Set($('#ta').value.split('\n').map(s=>s.trim()).filter(Boolean))];
  picked=picked.filter(s=>S.includes(s));sv('s',S);sv('p',picked);sv('m',M);list();drawDial();$('#modal').classList.remove('on')}};

/* gruplar: Fisher-Yates, tek kalan rastgele gruba eklenir */
const showG=(g,note)=>modal('<h2>Gruplar</h2>'+(note?'<p style="font-size:13px;color:#ffd166">'+esc(note)+'</p>':'')+g.map((m,i)=>'<h3 style="color:#ffd166">Takım '+(i+1)+'</h3>'+m.map(esc).join(', ')).join(''));
$('#gb').onclick=()=>{const n=+$('#gs').value,a=fisherYatesShuffle(S),g=[];
 for(let i=0;i<a.length;i+=n)g.push(a.slice(i,i+n));let note='';
 if(g.length>1&&g[g.length-1].length===1){const lone=g.pop()[0];g[Math.floor(Math.random()*g.length)].push(lone);note='* '+lone+' tek kaldığı için rastgele bir gruba dahil edildi.'}
 sv('g',g);sv('gn',note);showG(g,note);triggerConfetti()};
$('#bG').onclick=()=>{const g=ld('g',[]);g.length?showG(g,ld('gn','')):modal('<h2>Gruplar</h2>Henüz grup oluşturulmadı.')};

/* süre ölçer: bitince konfeti + audio2 zili (Sıfırla/Duraklat'a kadar çalar) */
let sec=300,iv=null;
const fm=()=>$('#time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
const tin=()=>Math.max(0,(+$('#mi').value||0)*60+(+$('#se').value||0));
$('#t1').onclick=()=>{if(iv)return;au();stopBell();$('#time').style.color='';if(sec<=0)sec=tin();
 if(sec<=0){flash('Lütfen geçerli bir zaman girin!');return}
 $('#t1').disabled=true;
 iv=setInterval(()=>{sec--;fm();if(sec<=0){clearInterval(iv);iv=null;$('#t1').disabled=false;$('#time').style.color='#ff4d6d';triggerConfetti();playBell();flash('⏰ Zaman bitti!')}},1000)};
$('#mi').oninput=$('#se').oninput=()=>{if(!iv){sec=tin();fm()}};
$('#t2').onclick=()=>{clearInterval(iv);iv=null;$('#t1').disabled=false;stopBell()};
const reset=$('#t3').onclick=()=>{clearInterval(iv);iv=null;stopBell();$('#t1').disabled=false;$('#time').style.color='';sec=tin();fm()};

/* verileri sıfırla: şifresiz, tek tık onay */
$('#rs').onclick=()=>{stopBell();
 modal('<h2>Verileri Sıfırla</h2><p>Seçilenler, seçilme sayıları, notlar ve gruplar silinecek.</p><button id="pk">Evet, sıfırla</button>');$('#pk').focus();
 $('#pk').onclick=()=>{picked=[];M={};sv('p',[]);sv('m',{});sv('g',[]);sv('gn','');reset();list();drawDial();$('#res').classList.remove('show');$('#modal').classList.remove('on')}};

applyTheme();list();requestAnimationFrame(loop);
</script></body></html>
